steps:
  - name: gcr.io/k8s-skaffold/pack
    args:
      - build
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workrate-manager/workrate-manager:$COMMIT_SHA
      - --builder=gcr.io/buildpacks/builder:latest
      - --env=GOOGLE_ENTRYPOINT=pnpm --filter @workspace/api-server run start

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workrate-manager/workrate-manager:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - workrate-manager
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workrate-manager/workrate-manager:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/workrate-manager/workrate-manager:$COMMIT_SHA
